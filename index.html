<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glitzer PNG</title>

<style>

/* =========================================================
   GRUNDLAYOUT
   ========================================================= */

html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 2px;
    box-sizing: border-box;
    background-color: #1a1a1a;
}

* {
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;

    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #1a1a1a;

    overflow: hidden;

    font-family: Arial, sans-serif;

    border-radius: 25px;

    touch-action: none;
}


/* =========================================================
   CONTAINER
   ========================================================= */

.bilder-container {
    display: flex;

    justify-content: center;
    align-items: center;

    position: relative;

    width: auto;
    height: auto;

    max-width: none;
    max-height: none;

    flex-shrink: 0;
}


/* =========================================================
   BILD
   ========================================================= */

.bild {
    display: block;

    width: auto;
    height: auto;

    max-width: none;
    max-height: none;

    object-fit: contain;

    cursor: pointer;

    user-select: none;

    -webkit-user-drag: none;

    touch-action: manipulation;

    transition:
        transform 0.3s cubic-bezier(.2,.8,.2,1),
        filter 0.3s ease;
}


/* =========================================================
   HOVER
   ========================================================= */

.bild:hover {
    transform: scale(1.03);

    filter:
        brightness(1.15)
        drop-shadow(
            0 0 5px
            rgba(255,127,0,.95)
        )
        drop-shadow(
            0 0 13px
            rgba(255,190,0,.55)
        );
}


/* =========================================================
   AKTIVIERTES BILD
   ========================================================= */

.bild.aktiv {
    filter:
        brightness(1.12)
        drop-shadow(
            0 0 5px
            rgba(255,145,0,.8)
        );
}


/* =========================================================
   HAUPT-GLITZER
   ========================================================= */

.glitzer {
    position: fixed;

    left: 0;
    top: 0;

    pointer-events: none;

    z-index: 99999;

    width: var(--size);
    height: var(--size);

    opacity: 0;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fffde8 10%,
            var(--color) 28%,
            rgba(255,180,0,.60) 45%,
            transparent 72%
        );

    border-radius: 50%;

    filter:
        drop-shadow(0 0 3px var(--color))
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 12px rgba(255,150,0,.45));

    animation:
        cursorTrail
        var(--duration)
        cubic-bezier(.15,.55,.25,1)
        forwards;
}


/* =========================================================
   LICHTSTRAHLEN
   ========================================================= */

.glitzer::before,
.glitzer::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


/* HORIZONTAL */

.glitzer::before {
    width: 185%;
    height: 14%;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,.10),
            var(--color),
            #ffffff,
            var(--color),
            rgba(255,255,255,.10),
            transparent
        );

    border-radius: 999px;

    filter: blur(.3px);
}


/* VERTIKAL */

.glitzer::after {
    width: 14%;
    height: 185%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.10),
            var(--color),
            #ffffff,
            var(--color),
            rgba(255,255,255,.10),
            transparent
        );

    border-radius: 999px;

    filter: blur(.3px);
}


/* =========================================================
   GRÖSSERER FUNKELSTERN
   ========================================================= */

.glitzer.long {
    filter:
        drop-shadow(0 0 4px #ffffff)
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 13px var(--color))
        drop-shadow(0 0 19px rgba(255,145,0,.35));
}


/* =========================================================
   GLITZERSTAUB
   ========================================================= */

.staub {
    position: fixed;

    left: 0;
    top: 0;

    pointer-events: none;

    z-index: 99998;

    width: var(--staub-size);
    height: var(--staub-size);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.72) 0%,
            var(--color) 28%,
            rgba(255,170,0,.42) 55%,
            transparent 100%
        );

    transform:
        translate(-50%, -50%);

    opacity: 0;

    box-shadow:
        0 0 4px var(--color),
        0 0 9px var(--color),
        0 0 16px rgba(255,150,0,.42),
        0 0 24px rgba(255,170,0,.18);

    animation:
        staubTrail
        var(--duration)
        ease-out
        forwards;
}


/* =========================================================
   CURSOR-SPUR
   ========================================================= */

@keyframes cursorTrail {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                var(--sx),
                var(--sy)
            )
            scale(.18);
    }

    10% {
        opacity: .95;

        transform:
            translate(-50%, -50%)
            translate(
                var(--sx),
                var(--sy)
            )
            scale(1);
    }

    30% {
        opacity: .85;

        transform:
            translate(-50%, -50%)
            translate(
                var(--mx),
                var(--my)
            )
            scale(.9);
    }

    60% {
        opacity: .48;

        transform:
            translate(-50%, -50%)
            translate(
                var(--ex),
                var(--ey)
            )
            scale(.55);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                var(--ex),
                var(--ey)
            )
            scale(.08);
    }
}


/* =========================================================
   STAUB-BEWEGUNG
   ========================================================= */

@keyframes staubTrail {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(.2);
    }

    20% {
        opacity: .8;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .25),
                calc(var(--dy) * .25)
            )
            scale(1);
    }

    65% {
        opacity: .55;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .65),
                calc(var(--dy) * .65)
            )
            scale(.8);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.2);
    }
}


/* =========================================================
   KLICK-FLASH
   ========================================================= */

.klick-flash {
    position: fixed;

    left: 0;
    top: 0;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 100000;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fff6a0 25%,
            #ffd000 50%,
            #ff7800 75%,
            transparent 100%
        );

    box-shadow:
        0 0 5px #fff000,
        0 0 12px #ffad00,
        0 0 22px #ff6500;

    transform:
        translate(-50%, -50%)
        scale(0);

    animation:
        flash .42s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* =========================================================
   KLICK-FLASH ANIMATION
   ========================================================= */

@keyframes flash {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    15% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.8);
    }

    45% {
        opacity: .8;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.15);
    }
}


/* =========================================================
   REDUZIERTE ANIMATION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .bild {
        transition: none;
    }

    .glitzer,
    .staub {
        animation-duration: .35s;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     BILD-CONTAINER
     ======================================================= -->

<div class="bilder-container">

    <img
        class="bild"
        src="Visuelle_Medien.png"
        alt="Bild"
        draggable="false"
    >

</div>


<script>

/* =========================================================
   EINSTELLUNGEN
   ========================================================= */

const bild =
    document.querySelector(".bild");

let effektAktiv = false;

let letzteX = 0;
let letzteY = 0;

let letzterSpawn = 0;

let aktiveGlitzer = 0;

const MAX_GLITZER = 180;


/* =========================================================
   BILD KLICK
   ========================================================= */

bild.addEventListener(
    "click",
    function(event) {

        effektAktiv = true;

        bild.classList.add("aktiv");

        letzteX =
            event.clientX;

        letzteY =
            event.clientY;

        klickEffekt(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   MAUSBEWEGUNG
   ========================================================= */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!effektAktiv) {
            return;
        }

        erzeugeBewegungsEffekt(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   TOUCH-BEWEGUNG
   ========================================================= */

document.addEventListener(
    "touchmove",
    function(event) {

        if (!effektAktiv) {
            return;
        }

        if (
            !event.touches ||
            !event.touches.length
        ) {
            return;
        }

        const touch =
            event.touches[0];

        erzeugeBewegungsEffekt(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: true
    }
);


/* =========================================================
   BEWEGUNGS-EFFEKT
   ========================================================= */

function erzeugeBewegungsEffekt(
    x,
    y
) {

    const dx =
        x - letzteX;

    const dy =
        y - letzteY;

    const entfernung =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const jetzt =
        performance.now();


    if (
        entfernung < 2
    ) {
        return;
    }


    if (
        jetzt - letzterSpawn < 12
    ) {

        letzteX = x;
        letzteY = y;

        return;
    }


    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {

        letzteX = x;
        letzteY = y;

        return;
    }


    /* Bewegungsrichtung */

    let nx = 0;
    let ny = 0;


    if (entfernung > 0) {

        nx =
            dx / entfernung;

        ny =
            dy / entfernung;
    }


    /*
       WICHTIG:
       Der Effekt startet exakt am Cursor.
       Danach wandert er ausschließlich
       entgegen der Bewegungsrichtung.
    */

    const trailX = x;
    const trailY = y;


    /* Hauptstern */

    createGlitzer(
        trailX,
        trailY,
        false,
        nx,
        ny
    );


    /* Staub */

    createStaub(
        trailX,
        trailY
    );

    createStaub(
        trailX,
        trailY
    );

    createStaub(
        trailX - nx * 6,
        trailY - ny * 6
    );

    createStaub(
        trailX - nx * 12,
        trailY - ny * 12
    );

    createStaub(
        trailX - nx * 25,
        trailY - ny * 25
    );

    createStaub(
        trailX - nx * 40,
        trailY - ny * 40
    );


    /* Größerer Stern */

    if (
        Math.random() > .68
    ) {

        createGlitzer(
            trailX,
            trailY,
            true,
            nx,
            ny
        );
    }


    /* Schnelle Bewegung */

    if (
        entfernung > 15
    ) {

        createStaub(
            trailX,
            trailY
        );

        createStaub(
            trailX - nx * 15,
            trailY - ny * 15
        );

        createStaub(
            trailX - nx * 30,
            trailY - ny * 30
        );

        if (entfernung > 28) {

            createStaub(
                trailX - nx * 45,
                trailY - ny * 45
            );

            createStaub(
                trailX - nx * 60,
                trailY - ny * 60
            );
        }
    }


    letzterSpawn =
        jetzt;

    letzteX =
        x;

    letzteY =
        y;
}


/* =========================================================
   HAUPT-GLITZER
   ========================================================= */

function createGlitzer(
    x,
    y,
    grosser = false,
    nx = 0,
    ny = 0
) {

    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {
        return;
    }


    const glitzer =
        document.createElement("div");


    glitzer.className =
        grosser
        ? "glitzer long"
        : "glitzer";


    /* Farbe */

    if (
        Math.random() < .5
    ) {

        glitzer.style.setProperty(
            "--color",
            "#ff8500"
        );

    } else {

        glitzer.style.setProperty(
            "--color",
            "#ffe000"
        );
    }


    /* Größe */

    const size =
        grosser
        ? 10 + Math.random() * 5
        : 4 + Math.random() * 4;


    glitzer.style.setProperty(
        "--size",
        size + "px"
    );


    /* Seitliche Bewegung */

    const seitlich =
        (Math.random() - .5) * 5;


    const px =
        -ny;

    const py =
        nx;


    const sx =
        px * seitlich;

    const sy =
        py * seitlich;


    /*
       Mittlere Position:
       deutlich nach hinten
    */

    const mx =
        sx -
        nx * (
            16 +
            Math.random() * 16
        );

    const my =
        sy -
        ny * (
            16 +
            Math.random() * 16
        );


    /*
       Endposition:
       langer Schweif hinter dem Cursor
    */

    const ex =
        mx -
        nx * (
            32 +
            Math.random() * 35
        ) +
        (Math.random() - .5) * 5;

    const ey =
        my -
        ny * (
            32 +
            Math.random() * 35
        ) +
        (Math.random() - .5) * 5;


    glitzer.style.setProperty(
        "--sx",
        sx + "px"
    );

    glitzer.style.setProperty(
        "--sy",
        sy + "px"
    );

    glitzer.style.setProperty(
        "--mx",
        mx + "px"
    );

    glitzer.style.setProperty(
        "--my",
        my + "px"
    );

    glitzer.style.setProperty(
        "--ex",
        ex + "px"
    );

    glitzer.style.setProperty(
        "--ey",
        ey + "px"
    );


    /* Lebensdauer */

    const duration =
        900 +
        Math.random() * 550;


    glitzer.style.setProperty(
        "--duration",
        duration + "ms"
    );


    glitzer.style.left =
        x + "px";

    glitzer.style.top =
        y + "px";


    aktiveGlitzer++;


    document.body.appendChild(
        glitzer
    );


    setTimeout(
        function() {

            glitzer.remove();

            aktiveGlitzer--;

        },
        duration + 60
    );
}


/* =========================================================
   GLITZERSTAUB
   ========================================================= */

function createStaub(
    x,
    y
) {

    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {
        return;
    }


    const staub =
        document.createElement("div");


    staub.className =
        "staub";


    /* Farbe */

    if (
        Math.random() < .5
    ) {

        staub.style.setProperty(
            "--color",
            "#ff8500"
        );

    } else {

        staub.style.setProperty(
            "--color",
            "#ffe000"
        );
    }


    /* Größe */

    const size =
        1.5 +
        Math.random() * 2.5;


    staub.style.setProperty(
        "--staub-size",
        size + "px"
    );


    /* Startposition */

    const startX =
        (Math.random() - .5) * 20;

    const startY =
        (Math.random() - .5) * 20;


    /* Bewegung */

    const dx =
        (Math.random() - .5) * 48;

    const dy =
        (Math.random() - .5) * 48;


    staub.style.left =
        (x + startX) + "px";

    staub.style.top =
        (y + startY) + "px";


    staub.style.setProperty(
        "--dx",
        dx + "px"
    );

    staub.style.setProperty(
        "--dy",
        dy + "px"
    );


    /* Lebensdauer */

    const duration =
        650 +
        Math.random() * 550;


    staub.style.setProperty(
        "--duration",
        duration + "ms"
    );


    aktiveGlitzer++;


    document.body.appendChild(
        staub
    );


    setTimeout(
        function() {

            staub.remove();

            aktiveGlitzer--;

        },
        duration + 60
    );
}


/* =========================================================
   KLICK-EFFEKT
   EXPLOSIONSARTIG
   ========================================================= */

function klickEffekt(
    x,
    y
) {

    /* Zentraler Blitz */

    const flash =
        document.createElement("div");


    flash.className =
        "klick-flash";


    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";


    document.body.appendChild(
        flash
    );


    /* 18 Explosionssterne */

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        createExplosionsGlitzer(
            x,
            y,
            Math.random() > .65
        );
    }


    /* 18 Staubpartikel */

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        createExplosionStaub(
            x,
            y
        );
    }


    setTimeout(
        function() {

            flash.remove();

        },
        500
    );
}


/* =========================================================
   EXPLOSIONS-GLITZER
   ========================================================= */

function createExplosionsGlitzer(
    x,
    y,
    grosser = false
) {

    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {
        return;
    }


    const glitzer =
        document.createElement("div");


    glitzer.className =
        grosser
        ? "glitzer long"
        : "glitzer";


    /* Farbe */

    if (
        Math.random() < .5
    ) {

        glitzer.style.setProperty(
            "--color",
            "#ff8500"
        );

    } else {

        glitzer.style.setProperty(
            "--color",
            "#ffe000"
        );
    }


    /* Größe */

    const size =
        grosser
        ? 13 + Math.random() * 8
        : 7 + Math.random() * 7;


    glitzer.style.setProperty(
        "--size",
        size + "px"
    );


    /* Zufälliger Winkel */

    const winkel =
        Math.random() *
        Math.PI *
        2;


    /* Entfernung */

    const entfernung =
        grosser
        ? 55 + Math.random() * 55
        : 35 + Math.random() * 70;


    /* Start */

    const sx =
        (Math.random() - .5) * 6;

    const sy =
        (Math.random() - .5) * 6;


    /* Mitte */

    const mx =
        Math.cos(winkel) *
        entfernung *
        .45;

    const my =
        Math.sin(winkel) *
        entfernung *
        .45;


    /* Ende */

    const ex =
        Math.cos(winkel) *
        entfernung;

    const ey =
        Math.sin(winkel) *
        entfernung;


    glitzer.style.setProperty(
        "--sx",
        sx + "px"
    );

    glitzer.style.setProperty(
        "--sy",
        sy + "px"
    );

    glitzer.style.setProperty(
        "--mx",
        mx + "px"
    );

    glitzer.style.setProperty(
        "--my",
        my + "px"
    );

    glitzer.style.setProperty(
        "--ex",
        ex + "px"
    );

    glitzer.style.setProperty(
        "--ey",
        ey + "px"
    );


    /* Explosionsgeschwindigkeit */

    const duration =
        500 +
        Math.random() * 350;


    glitzer.style.setProperty(
        "--duration",
        duration + "ms"
    );


    glitzer.style.left =
        x + "px";

    glitzer.style.top =
        y + "px";


    aktiveGlitzer++;


    document.body.appendChild(
        glitzer
    );


    setTimeout(
        function() {

            glitzer.remove();

            aktiveGlitzer--;

        },
        duration + 60
    );
}


/* =========================================================
   EXPLOSIONS-STAUB
   ========================================================= */

function createExplosionStaub(
    x,
    y
) {

    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {
        return;
    }


    const staub =
        document.createElement("div");


    staub.className =
        "staub";


    /* Farbe */

    if (
        Math.random() < .5
    ) {

        staub.style.setProperty(
            "--color",
            "#ff8500"
        );

    } else {

        staub.style.setProperty(
            "--color",
            "#ffe000"
        );
    }


    /* Größe */

    const size =
        3 +
        Math.random() * 4;


    staub.style.setProperty(
        "--staub-size",
        size + "px"
    );


    /* Zufällige Richtung */

    const winkel =
        Math.random() *
        Math.PI *
        2;


    const entfernung =
        35 +
        Math.random() * 75;


    const dx =
        Math.cos(winkel) *
        entfernung;

    const dy =
        Math.sin(winkel) *
        entfernung;


    staub.style.left =
        x + "px";

    staub.style.top =
        y + "px";


    staub.style.setProperty(
        "--dx",
        dx + "px"
    );

    staub.style.setProperty(
        "--dy",
        dy + "px"
    );


    /* Lebensdauer */

    const duration =
        450 +
        Math.random() * 400;


    staub.style.setProperty(
        "--duration",
        duration + "ms"
    );


    aktiveGlitzer++;


    document.body.appendChild(
        staub
    );


    setTimeout(
        function() {

            staub.remove();

            aktiveGlitzer--;

        },
        duration + 60
    );
}

</script>

</body>
</html>
